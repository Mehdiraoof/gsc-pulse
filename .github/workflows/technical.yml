name: PulseO technical health

# The technical checks of every site; an email only for a confirmed, new, worse or fixed problem. Approved by the owner:
#   * the full check once a week, Monday early morning: home page, robots.txt, sitemaps, key pages, sitemaps in Search Console
#   * a small check on the other days: only whether the home page is down and whether robots.txt blocks the whole site
# Started by hand it sends no email unless send_emails is ticked.
on:
  schedule:
    - cron: "43 2 * * 1"             # the full check: Monday about 02:43 UTC (05:43 Istanbul), off the hour; GitHub may start it later
    - cron: "23 2 * * 0,2,3,4,5,6"   # the small check: the other days about 02:23 UTC (05:23 Istanbul)
  workflow_dispatch:
    inputs:
      mode:
        description: "full (home page, robots.txt, sitemaps, key pages, sitemaps in Search Console) or daily (home page and robots.txt only)"
        required: false
        default: "full"
      only_site:
        description: "Run for this one site only (a name from SITES_JSON): every other site is left alone"
        required: false
        default: ""
      send_emails:
        description: "A run started by hand sends NO email unless asked. On: the alert email goes out as in a scheduled run"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gsc-pulse-sync       # the same group as the weekly sync: it writes the Index Status column into the content dashboards, which the sync refreshes
  cancel-in-progress: false

jobs:
  technical:
    runs-on: ubuntu-24.04
    timeout-minutes: 90     # a failed check is made again after the wait (30 minutes by default)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check the health of the sites
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_OAUTH_JSON: ${{ secrets.GSC_OAUTH_JSON }}
          SITES_JSON: ${{ secrets.SITES_JSON }}
          SITES_JSON_EXTRA: ${{ secrets.SITES_JSON_EXTRA }}
          SITES_JSON_MORE: ${{ secrets.SITES_JSON_MORE }}
          PYTHONUNBUFFERED: "1"          # the log is complete even if the run dies
          TECHNICAL_RUN: "true"
          # a scheduled run: the Monday one is the full check, the others are the small one; a run by hand takes its input
          TECHNICAL_MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '43 2 * * 1' && 'full' || 'daily') || inputs.mode }}
          ONLY_SITE: ${{ inputs.only_site }}
          SEND_EMAILS: ${{ inputs.send_emails }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python gsc_pulse.py
