name: PulseO weekly sync

on:
  schedule:
    - cron: "0 4 * * 1"   # every Monday 04:00 UTC (07:00 Istanbul)
  workflow_dispatch:       # adds a "Run workflow" button for manual runs
    inputs:
      discover_site:
        description: "Page type discovery only: site name from SITES_JSON (leave empty for the normal sync)"
        required: false
        default: ""
      rebuild_alarms:
        description: "Recompute R Alarms for all past periods with the current rules (normal sync otherwise)"
        required: false
        type: boolean
        default: false
      rebuild_decks:
        description: "Build and email the weekly and monthly decks now, even if already sent (normal sync otherwise)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # only used by the keep-alive step below

concurrency:
  group: gsc-pulse-sync     # never two syncs at once (they share the history sheet)
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync Search Console to Google Sheets
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          HISTORY_SHEET_ID: ${{ secrets.HISTORY_SHEET_ID }}
          SITES_JSON: ${{ secrets.SITES_JSON }}
          DISCOVER_SITE: ${{ inputs.discover_site }}
          REBUILD_ALARMS: ${{ inputs.rebuild_alarms }}
          REBUILD_DECKS: ${{ inputs.rebuild_decks }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python gsc_pulse.py

      # Public repos pause scheduled runs after 60 days without activity.
      # If the last commit is 45+ days old, add an empty commit to stay active.
      - name: Keep the weekly schedule alive
        if: success()
        run: |
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was $age_days days ago"
          if [ "$age_days" -ge 45 ]; then
            git config user.name "gsc-pulse-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep weekly schedule active"
            git push
          fi
