name: PulseO weekly sync

on:
  schedule:
    - cron: "17 3 * * 1"    # the SYNC: Monday 03:17 UTC (06:17 Istanbul); GitHub may start it hours late
    - cron: "13 14 * * 1"   # deck check 1: Monday about 14:13 UTC (17:13 Istanbul): sends only what is complete
    - cron: "13 17 * * 1"   # deck check 2: Monday about 17:13 UTC (20:13 Istanbul): sends with the texts that are ready
    - cron: "13 14 * * 2"   # catch-up: Tuesday 14:13 UTC: delivers a deck whose sync finished after check 2
  workflow_dispatch:       # adds a "Run workflow" button for manual runs
    inputs:
      discover_site:
        description: "Page type discovery only: site name from SITES_JSON (leave empty for the normal sync)"
        required: false
        default: ""
      rebuild_alarms:
        description: "Recompute R Alarms for all past periods with the current rules (normal sync otherwise)"
        required: false
        type: boolean
        default: false
      rebuild_views:
        description: "Delete and recreate the view tabs (Dashboard, Monthly, ...) of every enabled site; Events is kept (normal sync otherwise)"
        required: false
        type: boolean
        default: false
      rebuild_deck_site:
        description: "Build and email the decks of this one site now (a name from SITES_JSON); other sites are not resent"
        required: false
        default: ""
      rebuild_deck_kind:
        description: "With rebuild_deck_site: monthly, weekly or both (default both)"
        required: false
        default: ""
      create_content_test:
        description: "Content creation on the FAKE test site only: briefs, drafts or both (then the checklist is tested); probe: which AI models the key may use; rehearsal-prepare / rehearsal: a rehearsal on a copy of a real dashboard"
        required: false
        default: ""
      deck_phase:
        description: "build: only build and send the decks (the second run), with the texts that are ready in AI Notes"
        required: false
        default: ""
      wait_minutes:
        description: "With deck_phase build: wait up to this many minutes for the texts that are still waiting"
        required: false
        default: "0"
      email_test_summary:
        description: "With create_content_test: send ONE summary email to the owner at the end (otherwise a test sends nothing; the result is in the run log)"
        required: false
        default: ""
      ai_model:
        description: "Optional, for the content tests: the Gemini model to use first (each model has its own daily limit)"
        required: false
        default: ""
      rehearsal_site:
        description: "With create_content_test rehearsal-prepare or rehearsal: the site to rehearse content creation for, on a COPY of its dashboard (the real file is only read)"
        required: false
        default: ""
      create_content_limit:
        description: "With create_content_test: only this many AI requests per site, to see a run stop cleanly"
        required: false
        default: ""
      build_test_site:
        description: "Make (or find) the fake test site in your Drive (folder PulseO Test) and try the content checker on its sample documents. No real site is touched"
        required: false
        type: boolean
        default: false
      reset_test_site:
        description: "With build_test_site: put the fake dashboards back to their starting rows"
        required: false
        type: boolean
        default: false
      test_deck:
        description: "With rebuild_deck_site: send a test copy to the owner only, subject starts with [Test], and do not mark the deck as sent"
        required: false
        type: boolean
        default: false
      rebuild_content_site:
        description: "Refresh the content dashboard of this one site now (a name from SITES_JSON), even if it was refreshed this month"
        required: false
        default: ""
      content_copy_site:
        description: "Content dashboard test on a COPY: one forced refresh of this site's dashboard copy (a name from SITES_JSON) with the settings in the variable CONTENT_COPY_OVERRIDES. The real dashboard is only read, nothing is emailed"
        required: false
        default: ""
      access_check:
        description: "Read-only: for the files listed in the variable ACCESS_CHECK_IDS, say whether the tool's Google access can open them. Nothing is created, changed or sent"
        required: false
        type: boolean
        default: false
      only_site:
        description: "Run for this one site only (a name from SITES_JSON): every other site is left alone"
        required: false
        default: ""
      site_folders_site:
        description: "Make the Briefs and Drafts folders of this one site (next to its other files) and stop"
        required: false
        default: ""
      fix_keywords_site:
        description: "One-time fix of Primary Keywords for this one site (a name from SITES_JSON). Without fix_keywords_apply it is a DRY RUN: the plan goes into a new sheet in your Drive and the dashboard is not touched"
        required: false
        default: ""
      fix_keywords_apply:
        description: "With fix_keywords_site: write the plan to the dashboard (only after you read the dry run)"
        required: false
        type: boolean
        default: false
      mark_decks_site:
        description: "For a site that just got new Reports sheets: mark its latest decks as already sent, email nothing (a name from SITES_JSON)"
        required: false
        default: ""
      rebuild_decks:
        description: "Build and email the weekly and monthly decks now, even if already sent (normal sync otherwise)"
        required: false
        type: boolean
        default: false
      send_emails:
        description: "A run started by hand sends NO email unless asked. On: the emails of a scheduled run (due decks, notes to the owner). The deck inputs above ask for their own decks only"
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # only used by the keep-alive step below

concurrency:
  group: gsc-pulse-sync     # never two syncs at once (they share the history sheet)
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ inputs.deck_phase != 'build' && (github.event_name != 'schedule' || github.event.schedule == '17 3 * * 1') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60     # a first refresh of a big dashboard (thousands of pages to check) takes about 25 minutes
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync Search Console to Google Sheets
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_OAUTH_JSON: ${{ secrets.GSC_OAUTH_JSON }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          HISTORY_SHEET_ID: ${{ secrets.HISTORY_SHEET_ID }}
          SITES_JSON: ${{ secrets.SITES_JSON }}
          SITES_JSON_EXTRA: ${{ secrets.SITES_JSON_EXTRA }}
          SITES_JSON_MORE: ${{ secrets.SITES_JSON_MORE }}
          DISCOVER_SITE: ${{ inputs.discover_site }}
          REBUILD_ALARMS: ${{ inputs.rebuild_alarms }}
          REBUILD_DECKS: ${{ inputs.rebuild_decks }}
          REBUILD_DECK_SITE: ${{ inputs.rebuild_deck_site }}
          REBUILD_DECK_KIND: ${{ inputs.rebuild_deck_kind }}
          TEST_DECK: ${{ inputs.test_deck }}
          CREATE_CONTENT_TEST: ${{ inputs.create_content_test }}
          CREATE_CONTENT_LIMIT: ${{ inputs.create_content_limit }}
          REHEARSAL_SITE: ${{ inputs.rehearsal_site }}
          AI_MODEL: ${{ inputs.ai_model }}
          EMAIL_TEST_SUMMARY: ${{ inputs.email_test_summary }}
          SEND_EMAILS: ${{ inputs.send_emails }}
          AI_HANDOFF: ${{ vars.AI_HANDOFF }}
          # the key exists in the run only when a content test is asked for: a real-site run cannot call the AI
          GEMINI_API_KEY: ${{ inputs.create_content_test != '' && secrets.GEMINI_API_KEY || '' }}
          BUILD_TEST_SITE: ${{ inputs.build_test_site }}
          RESET_TEST_SITE: ${{ inputs.reset_test_site }}
          MARK_DECKS_SITE: ${{ inputs.mark_decks_site }}
          REBUILD_CONTENT_SITE: ${{ inputs.rebuild_content_site }}
          FIX_KEYWORDS_SITE: ${{ inputs.fix_keywords_site }}
          ONLY_SITE: ${{ inputs.only_site }}
          ACCESS_CHECK: ${{ inputs.access_check }}
          ACCESS_CHECK_IDS: ${{ vars.ACCESS_CHECK_IDS }}
          ACCESS_CHECK_AUDIT: ${{ vars.ACCESS_CHECK_AUDIT }}
          SITE_FOLDERS_SITE: ${{ inputs.site_folders_site }}
          FIX_KEYWORDS_APPLY: ${{ inputs.fix_keywords_apply }}
          CONTENT_COPY_SITE: ${{ inputs.content_copy_site }}
          CONTENT_COPY_OVERRIDES: ${{ vars.CONTENT_COPY_OVERRIDES }}
          REBUILD_VIEWS: ${{ inputs.rebuild_views }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python gsc_pulse.py

      # Public repos pause scheduled runs after 60 days without activity.
      # If the last commit is 45+ days old, add an empty commit to stay active.
      - name: Keep the weekly schedule alive
        if: success()
        run: |
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was $age_days days ago"
          if [ "$age_days" -ge 45 ]; then
            git config user.name "gsc-pulse-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep weekly schedule active"
            git push
          fi

  # The deck checks (scheduled runs of their own, Monday and the Tuesday catch-up): build the weekly and monthly decks
  # and email them, with the texts the owner's Claude plan wrote into the AI Notes tab. Only with the handoff on
  # (repository variable AI_HANDOFF = on), or by hand with deck_phase = build. Nothing waits for the clock: a check
  # sends a deck only if this period's sync has finished (the first check also only if every text is ready); the
  # second check and the catch-up send with whatever is ready. A deck is sent once (the sent state decides).
  build:
    if: ${{ inputs.deck_phase == 'build' || (github.event_name == 'schedule' && github.event.schedule != '17 3 * * 1' && vars.AI_HANDOFF == 'on') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and send the decks
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_OAUTH_JSON: ${{ secrets.GSC_OAUTH_JSON }}
          SITES_JSON: ${{ secrets.SITES_JSON }}
          SITES_JSON_EXTRA: ${{ secrets.SITES_JSON_EXTRA }}
          SITES_JSON_MORE: ${{ secrets.SITES_JSON_MORE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          AI_HANDOFF: on
          SEND_EMAILS: ${{ inputs.send_emails }}
          DECK_PHASE: build
          WAIT_FOR_TEXTS_MINUTES: ${{ inputs.wait_minutes }}
          # which scheduled check this is: the first sends only complete decks, the others send with what is ready
          DECK_CHECK: ${{ github.event_name == 'schedule' && (github.event.schedule == '13 14 * * 1' && 'first' || 'second') || '' }}
          REBUILD_DECKS: ${{ inputs.rebuild_decks }}
          REBUILD_DECK_SITE: ${{ inputs.rebuild_deck_site }}
          REBUILD_DECK_KIND: ${{ inputs.rebuild_deck_kind }}
          TEST_DECK: ${{ inputs.test_deck }}
        run: python gsc_pulse.py
