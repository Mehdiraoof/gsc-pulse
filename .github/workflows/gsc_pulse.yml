name: PulseO weekly sync

on:
  schedule:
    - cron: "0 4 * * 1"   # every Monday 04:00 UTC (07:00 Istanbul)
  workflow_dispatch:       # adds a "Run workflow" button for manual runs
    inputs:
      discover_site:
        description: "Page type discovery only: site name from SITES_JSON (leave empty for the normal sync)"
        required: false
        default: ""
      rebuild_alarms:
        description: "Recompute R Alarms for all past periods with the current rules (normal sync otherwise)"
        required: false
        type: boolean
        default: false
      rebuild_views:
        description: "Delete and recreate the view tabs (Dashboard, Monthly, ...) of every enabled site; Events is kept (normal sync otherwise)"
        required: false
        type: boolean
        default: false
      rebuild_deck_site:
        description: "Build and email the decks of this one site now (a name from SITES_JSON); other sites are not resent"
        required: false
        default: ""
      rebuild_deck_kind:
        description: "With rebuild_deck_site: monthly, weekly or both (default both)"
        required: false
        default: ""
      build_test_site:
        description: "Make (or find) the fake test site in your Drive (folder PulseO Test) and try the content checker on its sample documents. No real site is touched"
        required: false
        type: boolean
        default: false
      reset_test_site:
        description: "With build_test_site: put the fake dashboards back to their starting rows"
        required: false
        type: boolean
        default: false
      cleanup_gone_site:
        description: "One-off: move the pages of this site (a name from SITES_JSON) that were added already gone (first warned on cleanup_gone_since) to Removed Pages"
        required: false
        default: ""
      cleanup_gone_since:
        description: "With cleanup_gone_site: the day (YYYY-MM-DD) those pages were first warned"
        required: false
        default: ""
      test_deck:
        description: "With rebuild_deck_site: send a test copy to the owner only, subject starts with [Test], and do not mark the deck as sent"
        required: false
        type: boolean
        default: false
      rebuild_content_site:
        description: "Refresh the content dashboard of this one site now (a name from SITES_JSON), even if it was refreshed this month"
        required: false
        default: ""
      mark_decks_site:
        description: "For a site that just got new Reports sheets: mark its latest decks as already sent, email nothing (a name from SITES_JSON)"
        required: false
        default: ""
      rebuild_decks:
        description: "Build and email the weekly and monthly decks now, even if already sent (normal sync otherwise)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # only used by the keep-alive step below

concurrency:
  group: gsc-pulse-sync     # never two syncs at once (they share the history sheet)
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync Search Console to Google Sheets
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_OAUTH_JSON: ${{ secrets.GSC_OAUTH_JSON }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          HISTORY_SHEET_ID: ${{ secrets.HISTORY_SHEET_ID }}
          SITES_JSON: ${{ secrets.SITES_JSON }}
          SITES_JSON_EXTRA: ${{ secrets.SITES_JSON_EXTRA }}
          DISCOVER_SITE: ${{ inputs.discover_site }}
          REBUILD_ALARMS: ${{ inputs.rebuild_alarms }}
          REBUILD_DECKS: ${{ inputs.rebuild_decks }}
          REBUILD_DECK_SITE: ${{ inputs.rebuild_deck_site }}
          REBUILD_DECK_KIND: ${{ inputs.rebuild_deck_kind }}
          TEST_DECK: ${{ inputs.test_deck }}
          BUILD_TEST_SITE: ${{ inputs.build_test_site }}
          RESET_TEST_SITE: ${{ inputs.reset_test_site }}
          CLEANUP_GONE_SITE: ${{ inputs.cleanup_gone_site }}
          CLEANUP_GONE_SINCE: ${{ inputs.cleanup_gone_since }}
          MARK_DECKS_SITE: ${{ inputs.mark_decks_site }}
          REBUILD_CONTENT_SITE: ${{ inputs.rebuild_content_site }}
          REBUILD_VIEWS: ${{ inputs.rebuild_views }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python gsc_pulse.py

      # Public repos pause scheduled runs after 60 days without activity.
      # If the last commit is 45+ days old, add an empty commit to stay active.
      - name: Keep the weekly schedule alive
        if: success()
        run: |
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was $age_days days ago"
          if [ "$age_days" -ge 45 ]; then
            git config user.name "gsc-pulse-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep weekly schedule active"
            git push
          fi
